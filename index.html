    <style>
    *{box-sizing:border-box}
    body{

    .page{

    }
    .co{color:#1475d1}

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }
    .wa{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:48px;

      border-radius:13px;
      background:#25D366;
      color:#fff;

      white-space:nowrap;
      box-shadow:0 4px 12px rgba(37,211,102,.2);

    .wa:hover{background:#1fbd5b}
    .upload{

      border-radius:13px;

    .video-box{
      position:relative;

      border-radius:29px;

      aspect-ratio:9/16;
    }
    .video-box video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }
    .poster{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      cursor:pointer;
    }
    .video-box.playing .poster,
    .video-box.playing .play-button{display:none}
    .play-button{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);

      height:118px;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.95);
      cursor:pointer;
      z-index: 2;
    }
    .play-button:after{
      content:"";
      position:absolute;
      left:48%;
      top:37%;
      border-left:32px solid #111;
      border-top:21px solid transparent;
      border-bottom:21px solid transparent;
    }

    /* Styling Custom Modal Overlay ala Gambar */

      inset: 0;

    .custom-modal.hidden {

      padding: 30px 20px;

      color: #ccc;

    .modal-footer {
      font-size: 14px;
      font-weight: 800;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ad-container {
      margin: 20px 28px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 12px;
      text-align: center;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .note{
      text-align:center;
      color:#777;
      font-size:13px;
      padding:10px 20px 30px;
    }

    @media(max-width:600px){
      .header{height:78px;padding:0 16px;gap:8px}
      .brand{font-size:21px;gap:9px}
      .logo{width:43px;height:43px;border-radius:11px;font-size:23px}
      .actions{gap:6px}
      .wa{
        min-height:42px;
        padding:0 11px;
        border-radius:11px;

      }

        min-height:42px;
        padding:12px 14px;
        border-radius:11px;
        font-size:14px;
      }
      .ad{margin:22px 16px 12px;font-size:18px}
      .video-box{margin:0 16px;border-radius:25px}
      .play-button{width:92px;height:92px}
      .play-button:after{
        border-left-width:25px;
        border-top-width:16px;
        border-bottom-width:16px;
      }
      .ad-container {

<body>

<div class="page">

  <header class="header">
    <div class="brand">
      <div class="logo">V</div>
      <span>vldey<span class="co">.co</span></span>
    </div>

    <div class="actions">
      <a class="wa"
         href="https://videy.it.com"
         target="_blank"
         rel="noopener noreferrer">
        WEB UTAMA
      </a>

      <button class="upload" onclick="document.getElementById('fileInput').click()">
        Upload
      </button>
      <input id="fileInput" type="file" accept="video/*" hidden>
    </div>
  </header>

  <div class="ad">WEB UTAMA BANYAK PILIHAN</div>

  <section class="video-box" id="videoBox">
    <video id="video" controls playsinline preload="metadata">
      <source src="https://videy.it.com/videos/Di mobil bergoyang.mp4" type="video/mp4">
    </video>

    <img class="poster" src="poster.png" alt="Preview video">
    <button class="play-button" id="playButton" aria-label="Putar video"></button>

    <!-- Modal Pop-up Interaktif -->
    <div class="custom-modal hidden" id="customModal">
      <div class="modal-content">
        <div class="modal-title">Klik Di Mana Saja untuk Memulai Film</div>
        <div class="modal-desc">
          "Terima kasih sudah mengklik ku 1 kali, untuk menampilkan iklan dan <b>Play Movie</b>, mudah rezeki dan sehat terus buat kamu. Aamiin"
        </div>
        <div class="modal-footer">THIS PLAYER CONTAINS ADS</div>
      </div>
    </div>
  </section>

  <div class="ad-container">
    <script>
      atOptions = {
        'key' : 'fe355af9a8cd79f7503570c4a608593b',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/fe355af9a8cd79f7503570c4a608593b/invoke.js"></script>
  </div>

  <div style="text-align:center; margin: 10px 0;">
    <script async="async" data-cfasync="false" src="https://pl31718116.profitableratecpmnetwork.com/3a1065c5a29a13ae4b01c54778ef68e0/invoke.js"></script>
    <div id="container-3a1065c5a29a13ae4b01c54778ef68e0"></div>
  </div>

  <script src="https://pl32367010.profitableratecpmnetwork.com/26/df/67/26df673a455e2ad418b986584e6ea89b.js"></script>

  <div class="note">Video Player</div>
</div>

<script>
const box = document.getElementById('videoBox');
const video = document.getElementById('video');
const play = document.getElementById('playButton');
const poster = document.querySelector('.poster');
const fileInput = document.getElementById('fileInput');
const modal = document.getElementById('customModal');

// Ganti URL ini dengan link tujuan popunder / iklan Anda berikutnya
const popunderUrl = "https://uplcm.com/4/11506355"; 

let clickCount = 0;

function handleVideoTrigger(e) {
  e.stopPropagation();
  
  if (clickCount === 0) {
    // Klik Pertama: Membuka iklan popunder di tab baru dan menampilkan modal pop-up
    window.open(popunderUrl, '_blank');
    modal.classList.remove('hidden');
    clickCount++;
  } else if (clickCount === 1) {
    // Klik Kedua: Sembunyikan modal, arahkan ke link lain / kembali, lalu putar video
    modal.classList.add('hidden');
    box.classList.add('playing');
    video.play().catch(() => {});
    clickCount++; // Penanda selesai
  } else {
    // Klik selanjutnya langsung play video normal
    box.classList.add('playing');
    video.play().catch(() => {});
  }
}

play.addEventListener('click', handleVideoTrigger);
poster.addEventListener('click', handleVideoTrigger);
modal.addEventListener('click', handleVideoTrigger);

video.addEventListener('play', () => box.classList.add('playing'));
video.addEventListener('pause', () => {
  if (!video.ended && clickCount > 1) box.classList.remove('playing');
});
video.addEventListener('ended', () => box.classList.remove('playing'));

fileInput.addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  video.src = url;
  box.classList.add('playing');
  video.play().catch(()=>{});
});
</script>

</body>
</html>
